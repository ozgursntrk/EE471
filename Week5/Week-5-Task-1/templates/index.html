<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Speech Services</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>🎤 Azure Speech Services</h1>
    <p class="subtitle">Text-to-Speech &amp; Speech-to-Text powered by Azure AI Speech</p>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="tts-panel">Text to Speech</button>
      <button class="tab" data-tab="stt-panel">Speech to Text</button>
    </nav>

    <!-- ===== Text to Speech ===== -->
    <section id="tts-panel" class="panel">
      <label for="tts-text">Enter text to convert to speech:</label>
      <textarea id="tts-text" rows="5" maxlength="1000" placeholder="Hello, EE471 class"></textarea>

      <label for="tts-voice">Voice:</label>
      <select id="tts-voice">
        {% for value, name in voices.items() %}
          <option value="{{ value }}">{{ name }}</option>
        {% endfor %}
      </select>

      <div class="buttons">
        <button id="tts-synth-btn" class="primary">🔊 Synthesize Speech</button>
        <button id="tts-clear-btn" class="secondary">Clear</button>
      </div>

      <div id="tts-status" class="status hidden"></div>

      <div id="tts-result" class="result hidden">
        <h2>Generated Audio:</h2>
        <audio id="tts-player" controls></audio>
        <a id="tts-download" class="download" download="speech.wav">⬇️ Download Audio</a>
      </div>
    </section>

    <!-- ===== Speech to Text ===== -->
    <section id="stt-panel" class="panel hidden">
      <label>Record or upload audio to convert to text:</label>
      <div class="buttons">
        <button id="stt-record-btn" class="primary">🎙️ Start Recording</button>
        <button id="stt-stop-btn" class="danger" disabled>⏹️ Stop Recording</button>
      </div>
      <input type="file" id="stt-file" accept="audio/*">

      <label for="stt-language">Language:</label>
      <select id="stt-language">
        {% for value, name in languages.items() %}
          <option value="{{ value }}">{{ name }}</option>
        {% endfor %}
      </select>

      <audio id="stt-preview" controls class="hidden"></audio>

      <div class="buttons">
        <button id="stt-transcribe-btn" class="primary" disabled>📝 Transcribe Audio</button>
        <button id="stt-clear-btn" class="secondary">Clear</button>
      </div>

      <div id="stt-status" class="status hidden"></div>

      <div id="stt-result" class="result transcript-box hidden">
        <h2>Transcription:</h2>
        <p id="stt-transcript" class="transcript"></p>
        <button id="stt-copy-btn" class="secondary small">📋 Copy Text</button>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
